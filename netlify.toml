# Production host selected by the user. Dynamic Next.js routes require the runtime.
# Automatic detection did not install an adapter on the existing site, producing
# a successful static upload with 404s for every dynamic route. Explicitly invoke
# the pinned current v5 OpenNext adapter; do not publish .next as plain files.
# Secrets and runtime variables belong in Netlify's Production environment UI/API.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Trigger.dev workers deploy separately. Never launch workers from this build.
# Do not set NODE_ENV here: Netlify must install build devDependencies.
